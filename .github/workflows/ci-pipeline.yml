name: CI Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, reopened, synchronize]
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC: catch newly published vulnerabilities
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Format, tidy, vulnerabilities
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Check formatting
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "::error::Files need gofmt:"
            echo "$unformatted"
            exit 1
          fi

      - name: Check go.mod is tidy
        run: go mod tidy -diff

      - name: Install govulncheck
        run: |
          for i in {1..3}; do
            go install golang.org/x/vuln/cmd/govulncheck@v1.8.0 && break
            [ $i -lt 3 ] && sleep 5
          done

      - name: Run vulnerability check
        run: make vuln

  test:
    name: Vet and test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Vet
        run: make vet

      - name: Test with race detector
        run: make test-race
